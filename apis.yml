name: Cyberhaven
description: 'Cyberhaven is a data security company that unifies Data Security Posture
  Management (DSPM), Data Loss Prevention (DLP), Insider Risk Management, and AI Security
  into a single AI and data security platform. Its data lineage-first architecture traces
  data from origin to exfiltration across endpoints, cloud, on-prem, SaaS, and AI tools,
  coaching users and blocking leaks across email, web, cloud, removable storage, and
  AI assistants. Cyberhaven exposes a REST API (v1 and v2) that lets teams pull incidents
  into third-party security tools using API-key authentication, and integrates with
  directory services, SIEM/SOAR platforms, and cloud applications. Backed by Costanoa
  Ventures, Redpoint Ventures, and Wing Venture Capital.'
